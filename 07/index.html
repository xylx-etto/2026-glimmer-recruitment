<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Beautiful Pineapple</title>
<style>
  body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #fffdf0 0%, #ffeaa7 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 60px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease;
  }

  .card:hover {
      transform: translateY(-5px);
  }

  .icon {
      font-size: 120px;
      line-height: 1;
      margin-bottom: 20px;
      filter: drop-shadow(0 10px 15px rgba(180, 110, 0, 0.2));
      user-select: none;
  }

  .title {
      font-size: 28px;
      letter-spacing: 2px;
      color: #6b4701;
      font-weight: 700;
      text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="card">
<div class="icon">🍍</div>
<div class="title">Pineapple</div>
</div>

</body>
</html>
